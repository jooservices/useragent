name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-and-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag belongs to master
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/master
      - run: docker compose build php
      - run: docker compose run --rm php composer install --no-interaction --prefer-dist
      - run: docker compose run --rm php composer ci
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
